name: CI

on:
  workflow_dispatch:
    inputs:
      device_hub_only:
        type: boolean
        description: 'Build only the Windows app and test its HID drivers'
        default: false
  push:
    branches: [main]
  pull_request:

# 同じブランチへの連続 push では古い run を自動キャンセル。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Check
        if: inputs.device_hub_only != true
        run: cargo check --workspace --locked
      - name: Test
        if: inputs.device_hub_only != true
        run: cargo test --workspace --locked
      - name: Release build
        if: inputs.device_hub_only != true
        run: cargo build --release --locked -p device-hub -p devhub-obs
      - name: Stage Windows distribution
        if: inputs.device_hub_only != true
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        if: inputs.device_hub_only != true
        with:
          name: device-hub-windows-x64
          path: dist/
      - name: Test HID drivers
        if: inputs.device_hub_only == true
        run: cargo test --locked -p devhub-hid --lib
      - name: Build Windows app
        if: inputs.device_hub_only == true
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo build --release --locked -p device-hub
      - uses: actions/upload-artifact@v4
        if: inputs.device_hub_only == true
        with:
          name: device-hub-windows-app-x64
          path: target/release/device-hub.exe
